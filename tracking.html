<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SNACCY Order Tracking</title>
<link rel="stylesheet" href="CSS/theme.css">
<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#fff1f1,#ffffff);
}

.header{
    background:#151212;
    color:white;
    padding:18px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    margin:0;
    color:#ff4d4d;
}

.header a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.tracking-box{
    max-width:700px;
    margin:60px auto;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

.status-title{
    text-align:center;
    color:#ff3c00;
}

.timeline{
    margin-top:40px;
}

.step{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:30px;
    opacity:.35;
}

.step.active{
    opacity:1;
}

.circle{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

.step.active .circle{
    background:#ff3c00;
    color:white;
}

.step-text h3{
    margin:0;
}

.step-text p{
    margin:4px 0 0;
    color:#777;
}

.current{
    text-align:center;
    margin-top:25px;
    font-size:20px;
    font-weight:bold;
    color:green;
}
</style>
</head>

<body>
<script src="theme.js"></script>
<div class="header">
    <h1>SNACCY Tracking</h1>
    <a href="profile.html">Back to Profile</a>
</div>

<div class="tracking-box">
    <h2 class="status-title">🚴 Track Your Order</h2>
    <p id="orderId" style="text-align:center;"></p>

    <div class="timeline">

        <div class="step" id="Placed">
            <div class="circle">✅</div>
            <div class="step-text">
                <h3>Placed</h3>
                <p>Your order has been placed</p>
            </div>
        </div>

        <div class="step" id="Preparing">
            <div class="circle">🍳</div>
            <div class="step-text">
                <h3>Preparing</h3>
                <p>Restaurant is preparing your food</p>
            </div>
        </div>

        <div class="step" id="Out for Delivery">
            <div class="circle">🚴</div>
            <div class="step-text">
                <h3>Out for Delivery</h3>
                <p>Your food is on the way</p>
            </div>
        </div>

        <div class="step" id="Delivered">
            <div class="circle">🎉</div>
            <div class="step-text">
                <h3>Delivered</h3>
                <p>Enjoy your meal</p>
            </div>
        </div>

    </div>

    <div class="current" id="currentStatus">Loading...</div>
</div>

<script>
let user = JSON.parse(localStorage.getItem("user"));
let token = localStorage.getItem("token");

if(!user || !token){
    alert("Login first ❌");
    location.href = "login.html";
}

const params = new URLSearchParams(window.location.search);
const orderId = params.get("order");

document.getElementById("orderId").innerText = "Order #" + orderId;

const steps = ["Placed","Preparing","Out for Delivery","Delivered"];

function loadTracking(){
    fetch(`http://localhost:3000/orders/${user.id}`, {
        headers:{
            "Authorization": token
        }
    })
    .then(res => res.json())
    .then(data => {
        let order = data.find(o => String(o.id) === String(orderId));

        if(!order){
            document.getElementById("currentStatus").innerText = "Order not found ❌";
            return;
        }

        let status = order.status || "Placed";
        document.getElementById("currentStatus").innerText = "Current Status: " + status;

        let activeIndex = steps.indexOf(status);

        steps.forEach((s, i) => {
            let el = document.getElementById(s);
            if(i <= activeIndex){
                el.classList.add("active");
            }else{
                el.classList.remove("active");
            }
        });
    })
    .catch(err => {
        console.log(err);
        document.getElementById("currentStatus").innerText = "Tracking error ❌";
    });
}

loadTracking();
setInterval(loadTracking, 5000);
</script>

</body>
</html>
