<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burger King Menu</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f4f4f4;
}

/* NAVBAR */
.navbar{
    background:#ff5200;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.navbar button{
    background:white;
    color:#ff5200;
    border:none;
    padding:8px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    transition: all 0.3s ease;
}

.navbar button:hover{
    background:#e31837;
    color:white;
}

/* PAGE */
.menu-page{
    padding:40px 120px;
}

/* HEADER */
.menu-header{
    display:flex;
    gap:20px;
    background:white;
    padding:20px;
    border-radius:12px;
}

.menu-header img{
    width:200px;
    height:150px;
    border-radius:10px;
}

.rating{
    background:#ff5200;
    color:white;
    padding:4px 10px;
    border-radius:5px;
}

/* MENU */
.menu-container{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin-top:20px;
}

.menu-card{
    display:flex;
    justify-content:space-between;
    background:white;
    padding:18px;
    border-radius:10px;
    opacity:0;
    transform: translateY(20px);
    transition: transform 0.5s ease, opacity 0.5s ease, box-shadow 0.3s ease;
}

.menu-card.show{
    opacity:1;
    transform: translateY(0);
}

.menu-card:hover{
    transform: scale(1.03);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.price{
    color:#ff5200;
    font-weight:bold;
}

.food-image img{
    width:120px;
    height:100px;
    border-radius:10px;
}

/* ADD BUTTON */
.add-btn{
    margin-top:8px;
    background:white;
    color:#ff5200;
    border:2px solid #ff5200;
    padding:6px 15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition: all 0.2s ease;
}

.add-btn:hover{
    background:#ff5200;
    color:white;
    transform: scale(1.1);
}

/* QTY BOX */
.qty-box{
    margin-top:8px;
    display:none;
    align-items:center;
    gap:10px;
}

.qty-box button{
    background:#ff5200;
    color:white;
    border:none;
    width:28px;
    height:28px;
    border-radius:6px;
    cursor:pointer;
}

.qty{
    font-weight:bold;
    width:20px;
    text-align:center;
    display: inline-block;
    transition: transform 0.2s ease;
}

.qty.animate{
    transform: scale(1.3);
}

/* CART COUNT */
.cart-count{
    background:red;
    color:white;
    font-size:12px;
    padding:2px 6px;
    border-radius:50%;
    margin-left:5px;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div>🍔 Burger King</div>
    <div class="nav-right">
        <button onclick="goHome()">🏠 Home</button>
        <button onclick="goToCart()">🛒 Cart <span class="cart-count" id="cartCount">0</span></button>
       
    </div>
</div>

<section class="menu-page">

<!-- HEADER -->
<div class="menu-header">
    <img src="img/king logo.webp">
    <div>
        <h1>Burger King</h1>
        <p>Burgers, Fast Food</p>
        <span class="rating">⭐ 4.3</span>
    </div>
</div>

<h2>Burger Menu</h2>

<div class="menu-container">

<!-- ITEM 1 -->
<div class="menu-card">
    <div>
        <h3>Whopper Burger</h3>
        <p>Flame grilled patty</p>
        <div class="price">₹199</div>
    </div>
    <div class="food-image">
        <img src="img/woop.webp"><br>
        <button class="add-btn" id="add-Whopper Burger" onclick="addItem('Whopper Burger',199,'img/woop.webp')">ADD</button>
        <div class="qty-box" id="box-Whopper Burger">
            <button onclick="changeQty('Whopper Burger',-1)">−</button>
            <span class="qty" id="qty-Whopper Burger">1</span>
            <button onclick="changeQty('Whopper Burger',1)">+</button>
        </div>
    </div>
</div>

<!-- ITEM 2 -->
<div class="menu-card">
    <div>
        <h3>Chicken Burger</h3>
        <p>Crispy chicken burger</p>
        <div class="price">₹179</div>
    </div>
    <div class="food-image">
        <img src="img/chi bur.webp"><br>
        <button class="add-btn" id="add-Chicken Burger" onclick="addItem('Chicken Burger',179,'img/chi bur.webp')">ADD</button>
        <div class="qty-box" id="box-Chicken Burger">
            <button onclick="changeQty('Chicken Burger',-1)">−</button>
            <span class="qty" id="qty-Chicken Burger">1</span>
            <button onclick="changeQty('Chicken Burger',1)">+</button>
        </div>
    </div>
</div>

<!-- ITEM 3 -->
<div class="menu-card">
    <div>
        <h3>Veg Burger</h3>
        <p>Veg patty with cheese</p>
        <div class="price">₹149</div>
    </div>
    <div class="food-image">
        <img src="img/veg bur.webp"><br>
        <button class="add-btn" id="add-Veg Burger" onclick="addItem('Veg Burger',149,'img/veg bur.webp')">ADD</button>
        <div class="qty-box" id="box-Veg Burger">
            <button onclick="changeQty('Veg Burger',-1)">−</button>
            <span class="qty" id="qty-Veg Burger">1</span>
            <button onclick="changeQty('Veg Burger',1)">+</button>
        </div>
    </div>
</div>

<!-- ITEM 4 -->
<div class="menu-card">
    <div>
        <h3>Double Cheese Burger</h3>
        <p>Double cheese burger</p>
        <div class="price">₹229</div>
    </div>
    <div class="food-image">
        <img src="img/do bur.webp"><br>
        <button class="add-btn" id="add-Double Cheese Burger" onclick="addItem('Double Cheese Burger',229,'img/do bur.webp')">ADD</button>
        <div class="qty-box" id="box-Double Cheese Burger">
            <button onclick="changeQty('Double Cheese Burger',-1)">−</button>
            <span class="qty" id="qty-Double Cheese Burger">1</span>
            <button onclick="changeQty('Double Cheese Burger',1)">+</button>
        </div>
    </div>
</div>

<!-- ITEM 5 -->
<div class="menu-card">
    <div>
        <h3>French Fries</h3>
        <p>Crispy fries</p>
        <div class="price">₹99</div>
    </div>
    <div class="food-image">
        <img src="img/fre king.webp"><br>
        <button class="add-btn" id="add-French Fries" onclick="addItem('French Fries',99,'img/fre king.webp')">ADD</button>
        <div class="qty-box" id="box-French Fries">
            <button onclick="changeQty('French Fries',-1)">−</button>
            <span class="qty" id="qty-French Fries">1</span>
            <button onclick="changeQty('French Fries',1)">+</button>
        </div>
    </div>
</div>

</div>
</section>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addItem(name,price,img){
    let found = cart.find(item=>item.name===name);
    if(found) found.qty++;
    else cart.push({name,price,img,qty:1});
    saveCart();
    updateUI();
}

function changeQty(name,change){
    let item = cart.find(i=>i.name===name);
    if(item){
        item.qty += change;
        if(item.qty<=0) cart = cart.filter(i=>i.name!==name);
    }
    saveCart();
    updateUI();

    // Quantity animation
    let qty = document.getElementById("qty-"+name);
    if(qty){
        qty.classList.add("animate");
        setTimeout(()=> qty.classList.remove("animate"),200);
    }
}

function saveCart(){
    localStorage.setItem("cart",JSON.stringify(cart));
}

function updateUI(){
    document.querySelectorAll(".add-btn").forEach(btn=>btn.style.display="inline-block");
    document.querySelectorAll(".qty-box").forEach(box=>box.style.display="none");

    cart.forEach(item=>{
        let addBtn=document.getElementById("add-"+item.name);
        let box=document.getElementById("box-"+item.name);
        let qty=document.getElementById("qty-"+item.name);

        if(addBtn){
            addBtn.style.display="none";
            box.style.display="flex";
            qty.innerText=item.qty;
        }
    });

    // Cart count
    let total = cart.reduce((sum,i)=>sum+i.qty,0);
    document.getElementById("cartCount").innerText = total;
}

// Page navigation
function goToCart(){ window.location.href="cart.html"; }
function goHome(){ window.location.href="index.html"; }

// Animate menu cards on page load
window.addEventListener('load', ()=>{
    document.querySelectorAll(".menu-card").forEach((card,index)=>{
        setTimeout(()=> card.classList.add("show"), index*100);
    });
});

updateUI();
</script>

</body>
</html>
