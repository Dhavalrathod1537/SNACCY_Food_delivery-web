<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="CSS/theme.css">
<meta charset="UTF-8">
<title>SNACCY Invoice By Dharmendra</title>

<style>
body{
font-family:Arial;
background:#f4f6f8;
margin:0;
}

.home-btn{
position:fixed;
top:20px;
right:20px;
background:#ff3c00;
color:white;
padding:10px 18px;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}

.invoice{
max-width:800px;
margin:40px auto;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:2px solid #eee;
padding-bottom:15px;
}

.logo{
display:flex;
align-items:center;
}

.logo img{
width:60px;
margin-right:10px;
}

.logo h1{
color:#ff3c00;
margin:0;
}

.bill-info{
text-align:right;
font-size:14px;
}

.section{
margin-top:25px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}

th{
background:#f5f5f5;
}

.total-box{
margin-top:20px;
width:300px;
float:right;
}

.total-box p{
display:flex;
justify-content:space-between;
margin:6px 0;
}

.total-box .grand{
font-size:18px;
font-weight:bold;
border-top:2px solid #ddd;
padding-top:10px;
}

.btn{
margin-top:40px;
padding:12px 20px;
background:#ff3c00;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

@media print{
.home-btn,.btn{display:none;}
body{background:white;}
.invoice{box-shadow:none;}
}
</style>
</head>

<body>
<script src="theme.js"></script>
<a href="index.html" class="home-btn">Home</a>

<div class="invoice">

<div class="header">
<div class="logo">
<img src="img/logo.png">
<h1>SNACCY</h1>
</div>

<div class="bill-info">
<p><b>Invoice No:</b> SNX10245</p>
<p id="date"></p>
<p id="payment"></p>
</div>
</div>

<div class="section">
<h3>Customer Details</h3>
<p id="customer"></p>
</div>

<div class="section">
<h3>Order Details</h3>

<table id="orderTable">
<tr>
<th>Item</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
</tr>
</table>
</div>

<div class="total-box" id="totalBox"></div>

<div style="clear:both"></div>

<button class="btn" onclick="downloadInvoice()">Download Invoice</button>

</div>

<script>

/* ✅ GET CORRECT ORDER */
let data = JSON.parse(localStorage.getItem("orderData")) || {};
let cart = Array.isArray(data.cart) ? data.cart : [];

/* DATE */
document.getElementById("date").innerHTML =
"<b>Date:</b> " + new Date().toLocaleString();

/* PAYMENT */
document.getElementById("payment").innerHTML =
"<b>Payment:</b> " + (data.payment || "UPI");

/* CUSTOMER */
document.getElementById("customer").innerHTML = `
Name: ${data.name || "-"}<br>
Phone: ${data.phone || "-"}<br>
Address: ${data.address || "-"}, ${data.city || "-"}
`;

/* TABLE */
let table = document.getElementById("orderTable");
let subtotal = 0;

/* CLEAR OLD ROWS */
table.innerHTML = `
<tr>
<th>Item</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
</tr>
`;

cart.forEach(item => {

let name = item.name || "Item";
let price = Number(item.price || 0);
let qty = Number(item.qty || 1);

let totalItem = price * qty;

table.innerHTML += `
<tr>
<td>${name}</td>
<td>₹${price}</td>
<td>${qty}</td>
<td>₹${totalItem}</td>
</tr>
`;

subtotal += totalItem;
});

let delivery = 40;
let gst = subtotal * 0.05;
let total = subtotal + gst + delivery;

document.getElementById("totalBox").innerHTML = `
<p><span>Subtotal</span><span>₹${subtotal}</span></p>
<p><span>Delivery</span><span>₹${delivery}</span></p>
<p><span>GST</span><span>₹${gst.toFixed(2)}</span></p>
<p class="grand"><span>Total</span><span>₹${total.toFixed(2)}</span></p>
`;

function downloadInvoice(){
window.print();
}

/* optional cleanup */
setTimeout(()=>{
localStorage.removeItem("orderData");
},3000);

</script>

</body>
</html>
